name: phase12-quality-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  phase12-go-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source without external actions
        run: |
          test "$GITHUB_REPOSITORY" = fqwink/Build-Scripts
          test "$GITHUB_SERVER_URL" = https://github.com
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          workspace=$(pwd -P)
          expected_workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          test "$workspace" = "$expected_workspace"
          workspace_entry=$(find . -mindepth 1 -maxdepth 1 -print -quit)
          test -z "$workspace_entry"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git -c core.hooksPath=/dev/null init --quiet --template= .
          git -c core.hooksPath=/dev/null remote add origin https://github.com/fqwink/Build-Scripts.git
          git -c core.hooksPath=/dev/null fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null checkout --quiet --detach "$GITHUB_SHA"
          tested_sha=$(git rev-parse HEAD)
          test "$tested_sha" = "$GITHUB_SHA"
      - name: Prepare verified go runtime
        run: bash .github/scripts/development-ci.sh go
      - run: |
          format_output=$(gofmt -l main.go main_test.go components/*/*.go)
          test -z "$format_output"
      - name: Clean temporary toolchain
        if: ${{ always() }}
        run: |
          if test -f .github/scripts/development-ci.sh; then
            bash .github/scripts/development-ci.sh cleanup
          else
            test -z "${ADLAIRE_CI_TOOLS:-}"
          fi

  phase12-go-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source without external actions
        run: |
          test "$GITHUB_REPOSITORY" = fqwink/Build-Scripts
          test "$GITHUB_SERVER_URL" = https://github.com
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          workspace=$(pwd -P)
          expected_workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          test "$workspace" = "$expected_workspace"
          workspace_entry=$(find . -mindepth 1 -maxdepth 1 -print -quit)
          test -z "$workspace_entry"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git -c core.hooksPath=/dev/null init --quiet --template= .
          git -c core.hooksPath=/dev/null remote add origin https://github.com/fqwink/Build-Scripts.git
          git -c core.hooksPath=/dev/null fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null checkout --quiet --detach "$GITHUB_SHA"
          tested_sha=$(git rev-parse HEAD)
          test "$tested_sha" = "$GITHUB_SHA"
      - name: Prepare verified go runtime
        run: bash .github/scripts/development-ci.sh go
      - run: go test ./...
      - name: Clean temporary toolchain
        if: ${{ always() }}
        run: |
          if test -f .github/scripts/development-ci.sh; then
            bash .github/scripts/development-ci.sh cleanup
          else
            test -z "${ADLAIRE_CI_TOOLS:-}"
          fi

  phase12-go-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source without external actions
        run: |
          test "$GITHUB_REPOSITORY" = fqwink/Build-Scripts
          test "$GITHUB_SERVER_URL" = https://github.com
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          workspace=$(pwd -P)
          expected_workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          test "$workspace" = "$expected_workspace"
          workspace_entry=$(find . -mindepth 1 -maxdepth 1 -print -quit)
          test -z "$workspace_entry"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git -c core.hooksPath=/dev/null init --quiet --template= .
          git -c core.hooksPath=/dev/null remote add origin https://github.com/fqwink/Build-Scripts.git
          git -c core.hooksPath=/dev/null fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null checkout --quiet --detach "$GITHUB_SHA"
          tested_sha=$(git rev-parse HEAD)
          test "$tested_sha" = "$GITHUB_SHA"
      - name: Prepare verified go runtime
        run: bash .github/scripts/development-ci.sh go
      - run: go test -race ./...
      - name: Clean temporary toolchain
        if: ${{ always() }}
        run: |
          if test -f .github/scripts/development-ci.sh; then
            bash .github/scripts/development-ci.sh cleanup
          else
            test -z "${ADLAIRE_CI_TOOLS:-}"
          fi

  phase12-go-vet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source without external actions
        run: |
          test "$GITHUB_REPOSITORY" = fqwink/Build-Scripts
          test "$GITHUB_SERVER_URL" = https://github.com
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          workspace=$(pwd -P)
          expected_workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          test "$workspace" = "$expected_workspace"
          workspace_entry=$(find . -mindepth 1 -maxdepth 1 -print -quit)
          test -z "$workspace_entry"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git -c core.hooksPath=/dev/null init --quiet --template= .
          git -c core.hooksPath=/dev/null remote add origin https://github.com/fqwink/Build-Scripts.git
          git -c core.hooksPath=/dev/null fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null checkout --quiet --detach "$GITHUB_SHA"
          tested_sha=$(git rev-parse HEAD)
          test "$tested_sha" = "$GITHUB_SHA"
      - name: Prepare verified go runtime
        run: bash .github/scripts/development-ci.sh go
      - run: go vet ./...
      - name: Clean temporary toolchain
        if: ${{ always() }}
        run: |
          if test -f .github/scripts/development-ci.sh; then
            bash .github/scripts/development-ci.sh cleanup
          else
            test -z "${ADLAIRE_CI_TOOLS:-}"
          fi

  phase12-deno-check-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source without external actions
        run: |
          test "$GITHUB_REPOSITORY" = fqwink/Build-Scripts
          test "$GITHUB_SERVER_URL" = https://github.com
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          workspace=$(pwd -P)
          expected_workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          test "$workspace" = "$expected_workspace"
          workspace_entry=$(find . -mindepth 1 -maxdepth 1 -print -quit)
          test -z "$workspace_entry"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git -c core.hooksPath=/dev/null init --quiet --template= .
          git -c core.hooksPath=/dev/null remote add origin https://github.com/fqwink/Build-Scripts.git
          git -c core.hooksPath=/dev/null fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null checkout --quiet --detach "$GITHUB_SHA"
          tested_sha=$(git rev-parse HEAD)
          test "$tested_sha" = "$GITHUB_SHA"
      - name: Prepare verified deno runtime
        run: bash .github/scripts/development-ci.sh deno
      - run: deno check --no-config --no-npm admin/adlaire-ci-sdk.js
      - name: Clean temporary toolchain
        if: ${{ always() }}
        run: |
          if test -f .github/scripts/development-ci.sh; then
            bash .github/scripts/development-ci.sh cleanup
          else
            test -z "${ADLAIRE_CI_TOOLS:-}"
          fi

  phase12-fixture-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source without external actions
        run: |
          test "$GITHUB_REPOSITORY" = fqwink/Build-Scripts
          test "$GITHUB_SERVER_URL" = https://github.com
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          workspace=$(pwd -P)
          expected_workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          test "$workspace" = "$expected_workspace"
          workspace_entry=$(find . -mindepth 1 -maxdepth 1 -print -quit)
          test -z "$workspace_entry"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git -c core.hooksPath=/dev/null init --quiet --template= .
          git -c core.hooksPath=/dev/null remote add origin https://github.com/fqwink/Build-Scripts.git
          git -c core.hooksPath=/dev/null fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null checkout --quiet --detach "$GITHUB_SHA"
          tested_sha=$(git rev-parse HEAD)
          test "$tested_sha" = "$GITHUB_SHA"
      - name: Prepare verified go runtime
        run: bash .github/scripts/development-ci.sh go
      - run: go test ./... -run 'TestPhase12|TestPhase11FixtureManifestGate'
      - name: Clean temporary toolchain
        if: ${{ always() }}
        run: |
          if test -f .github/scripts/development-ci.sh; then
            bash .github/scripts/development-ci.sh cleanup
          else
            test -z "${ADLAIRE_CI_TOOLS:-}"
          fi

  phase12-mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source without external actions
        run: |
          test "$GITHUB_REPOSITORY" = fqwink/Build-Scripts
          test "$GITHUB_SERVER_URL" = https://github.com
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          workspace=$(pwd -P)
          expected_workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          test "$workspace" = "$expected_workspace"
          workspace_entry=$(find . -mindepth 1 -maxdepth 1 -print -quit)
          test -z "$workspace_entry"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git -c core.hooksPath=/dev/null init --quiet --template= .
          git -c core.hooksPath=/dev/null remote add origin https://github.com/fqwink/Build-Scripts.git
          git -c core.hooksPath=/dev/null fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null checkout --quiet --detach "$GITHUB_SHA"
          tested_sha=$(git rev-parse HEAD)
          test "$tested_sha" = "$GITHUB_SHA"
      - name: Prepare verified go runtime
        run: bash .github/scripts/development-ci.sh go
      - run: go test ./... -run TestPhase12QualityGateEvidence
      - name: Clean temporary toolchain
        if: ${{ always() }}
        run: |
          if test -f .github/scripts/development-ci.sh; then
            bash .github/scripts/development-ci.sh cleanup
          else
            test -z "${ADLAIRE_CI_TOOLS:-}"
          fi

  phase12-required-gate:
    if: ${{ always() }}
    needs:
      - phase12-go-format
      - phase12-go-test
      - phase12-go-race
      - phase12-go-vet
      - phase12-deno-check-sdk
      - phase12-fixture-harness
      - phase12-mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source without external actions
        run: |
          test "$GITHUB_REPOSITORY" = fqwink/Build-Scripts
          test "$GITHUB_SERVER_URL" = https://github.com
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          workspace=$(pwd -P)
          expected_workspace=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          test "$workspace" = "$expected_workspace"
          workspace_entry=$(find . -mindepth 1 -maxdepth 1 -print -quit)
          test -z "$workspace_entry"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git -c core.hooksPath=/dev/null init --quiet --template= .
          git -c core.hooksPath=/dev/null remote add origin https://github.com/fqwink/Build-Scripts.git
          git -c core.hooksPath=/dev/null fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          git -c core.hooksPath=/dev/null checkout --quiet --detach "$GITHUB_SHA"
          tested_sha=$(git rev-parse HEAD)
          test "$tested_sha" = "$GITHUB_SHA"
      - name: Prepare verified go runtime
        run: bash .github/scripts/development-ci.sh go
      - name: Verify required checks and checkout identity
        env:
          ADLAIRE_ACTIONS_GATE: required
          ADLAIRE_ACTIONS_NEEDS: ${{ toJSON(needs) }}
        run: |
          test "$ADLAIRE_ACTIONS_GATE" = required
          test -n "$ADLAIRE_ACTIONS_NEEDS"
          go test . -run '^TestDevelopmentActions(RequiredGate|WorkflowContract|GateControls|NodeFreeControls|BootstrapControls)$' -count=1 -v | tee "$RUNNER_TEMP/development-actions-gate.log"
          for required_test in TestDevelopmentActionsRequiredGate TestDevelopmentActionsWorkflowContract TestDevelopmentActionsGateControls TestDevelopmentActionsNodeFreeControls TestDevelopmentActionsBootstrapControls; do
            grep -Fq -- "--- PASS: $required_test (" "$RUNNER_TEMP/development-actions-gate.log"
          done
          grep -Fq '"record_type":"development-actions-gate"' "$RUNNER_TEMP/development-actions-gate.log"
      - name: Clean temporary toolchain
        if: ${{ always() }}
        run: |
          if test -f .github/scripts/development-ci.sh; then
            bash .github/scripts/development-ci.sh cleanup
          else
            test -z "${ADLAIRE_CI_TOOLS:-}"
          fi
