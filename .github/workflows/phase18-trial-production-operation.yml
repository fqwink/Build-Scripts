name: phase18-trial-production-operation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  phase18-trial-production-operation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.22"
      - run: go test ./... -run TestPhase18TrialProductionOperationEvidence -count=1

  phase18-trial-production-vps-operation:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/phase-18-trial-production-operation'
    needs: phase18-trial-production-operation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PHASE18_ADMIN_PASSWORD: ${{ secrets.PHASE18_ADMIN_PASSWORD }}
      PHASE18_SSH_HOST: ${{ secrets.PHASE18_SSH_HOST }}
      PHASE18_SSH_KNOWN_HOSTS: ${{ secrets.PHASE18_SSH_KNOWN_HOSTS }}
      PHASE18_SSH_PORT: ${{ secrets.PHASE18_SSH_PORT }}
      PHASE18_SSH_PRIVATE_KEY: ${{ secrets.PHASE18_SSH_PRIVATE_KEY }}
      PHASE18_SSH_USER: ${{ secrets.PHASE18_SSH_USER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.22"
      - name: Validate trial production secrets
        run: |
          set -euo pipefail
          missing=()
          for name in PHASE18_ADMIN_PASSWORD PHASE18_SSH_HOST PHASE18_SSH_KNOWN_HOSTS PHASE18_SSH_PRIVATE_KEY PHASE18_SSH_USER; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'missing required Phase 18 secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - name: Build current ref linux assets
        run: |
          set -euo pipefail
          version="V.18.${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          for binary in adlaire-ci-build adlaire-ci-runner adlaire-ci-api adlaire-ci-admin adlaire-ci-setup adlaire-ci-release adlaire-ci-mcp adlaire-ci-obsidian; do
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "-s -w -X main.binaryVersion=${version}" -o "dist/${binary}" .
          done
          tar -C dist -czf phase18-binaries.tar.gz .
          tar -C admin -czf phase18-admin.tar.gz .
          printf '%s\n' "${version}" > phase18-version.txt
      - name: Run trial production operation on VPS
        run: |
          set -euo pipefail
          ssh_dir="${RUNNER_TEMP}/phase18-ssh"
          mkdir -p "${ssh_dir}"
          chmod 700 "${ssh_dir}"
          key_file="${ssh_dir}/key"
          known_hosts_file="${ssh_dir}/known_hosts"
          printf '%s\n' "${PHASE18_SSH_PRIVATE_KEY}" > "${key_file}"
          printf '%s\n' "${PHASE18_SSH_KNOWN_HOSTS}" > "${known_hosts_file}"
          chmod 600 "${key_file}" "${known_hosts_file}"
          port="${PHASE18_SSH_PORT:-22}"
          remote="${PHASE18_SSH_USER}@${PHASE18_SSH_HOST}"
          ssh_opts=(-i "${key_file}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${known_hosts_file}" -o LogLevel=ERROR -p "${port}")
          remote_dir="$(ssh "${ssh_opts[@]}" "${remote}" 'mktemp -d "${TMPDIR:-/tmp}/adlaire-phase18.XXXXXX"')"
          scp -q -P "${port}" -i "${key_file}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${known_hosts_file}" -o LogLevel=ERROR \
            phase18-binaries.tar.gz phase18-admin.tar.gz phase18-version.txt "${remote}:${remote_dir}/"
          printf '%s\n' "${PHASE18_ADMIN_PASSWORD}" | ssh "${ssh_opts[@]}" "${remote}" "cat > '${remote_dir}/admin_password' && chmod 600 '${remote_dir}/admin_password'"
          cat > "${RUNNER_TEMP}/phase18-remote.sh" <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          remote_dir="$1"
          session_id="$2"
          install_dir="/opt/adlaire-builder"
          bin_dir="/usr/local/bin"
          evidence="${remote_dir}/evidence.jsonl"
          version="$(cat "${remote_dir}/phase18-version.txt")"
          closed="0"
          binaries=(adlaire-ci-build adlaire-ci-runner adlaire-ci-api adlaire-ci-admin adlaire-ci-setup adlaire-ci-release adlaire-ci-mcp adlaire-ci-obsidian)
          core_binaries=(adlaire-ci-build adlaire-ci-runner adlaire-ci-api adlaire-ci-admin adlaire-ci-setup)

          record() {
            work_unit="$1"
            status="$2"
            detail="$3"
            at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            printf '{"session_id":"%s","evidence_origin":"real-vps-operation","execution_environment":"trial-production-vps","metadata_policy":"opaque-non-secret-labels","work_unit":"%s","status":"%s","detail":"%s","at":"%s"}\n' \
              "${session_id}" "${work_unit}" "${status}" "${detail}" "${at}" >> "${evidence}"
          }

          close_session() {
            if [ "${closed}" = "0" ]; then
              record "operation-session-close" "$1" "$2"
              closed="1"
            fi
          }

          finish() {
            rc="$?"
            rm -f "${remote_dir}/admin_password" "${remote_dir}/login.json" "${remote_dir}/token.txt"
            if [ "${rc}" -ne 0 ]; then
              close_session "failed" "open_item_nonzero"
            fi
            exit "${rc}"
          }
          trap finish EXIT

          sudo -n true
          record "operation-session-open" "ok" "manual-approved-operation-session"

          . /etc/os-release
          if [ "${ID:-}" != "ubuntu" ] || [ "${VERSION_ID:-}" != "24.04" ]; then
            record "phase17-handover" "failed" "ubuntu-24.04-required"
            exit 1
          fi
          record "phase17-handover" "ok" "ubuntu-24.04"

          sudo install -d -m 0700 "${install_dir}"
          sudo install -d -m 0755 "${bin_dir}"
          install -d -m 0700 "${remote_dir}/backup"
          install -d -m 0700 "${remote_dir}/payload"
          tar -xzf "${remote_dir}/phase18-binaries.tar.gz" -C "${remote_dir}/payload"

          preexisting_core=0
          for binary in "${binaries[@]}"; do
            if sudo test -f "${bin_dir}/${binary}"; then
              sudo cp -a "${bin_dir}/${binary}" "${remote_dir}/backup/${binary}"
              case " ${core_binaries[*]} " in
                *" ${binary} "*) preexisting_core=$((preexisting_core + 1)) ;;
              esac
            else
              touch "${remote_dir}/backup/${binary}.absent"
            fi
            sudo install -m 0755 "${remote_dir}/payload/${binary}" "${bin_dir}/${binary}"
            sudo "${bin_dir}/${binary}" --version >/dev/null
          done

          if sudo test -d "${install_dir}/admin"; then
            sudo rm -rf "${remote_dir}/admin-backup"
            sudo cp -a "${install_dir}/admin" "${remote_dir}/admin-backup"
          fi
          sudo rm -rf "${install_dir}/admin.next"
          sudo install -d -m 0755 "${install_dir}/admin.next"
          sudo tar -xzf "${remote_dir}/phase18-admin.tar.gz" -C "${install_dir}/admin.next"
          sudo rm -rf "${install_dir}/admin"
          sudo mv "${install_dir}/admin.next" "${install_dir}/admin"
          sudo chmod -R go-w "${install_dir}/admin"

          if ! sudo test -f "${install_dir}/.last_sha"; then
            printf '{"sha":""}\n' | sudo tee "${install_dir}/.last_sha" >/dev/null
            sudo chmod 0600 "${install_dir}/.last_sha"
          fi
          if ! sudo test -f "${install_dir}/.admin_credentials"; then
            sudo "${bin_dir}/adlaire-ci-api" --state-dir "${install_dir}" --init-credentials < "${remote_dir}/admin_password" >/dev/null
          fi

          sudo tee /etc/systemd/system/adlaire-ci.service >/dev/null <<UNIT
          [Unit]
          Description=Adlaire CI Runner
          After=network.target

          [Service]
          Type=oneshot
          User=root
          WorkingDirectory=${install_dir}
          ExecStart=${bin_dir}/adlaire-ci-runner --state-dir ${install_dir}
          UNIT

          sudo tee /etc/systemd/system/adlaire-ci.timer >/dev/null <<UNIT
          [Unit]
          Description=Adlaire CI Runner Timer

          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=5min
          Unit=adlaire-ci.service

          [Install]
          WantedBy=timers.target
          UNIT

          sudo tee /etc/systemd/system/adlaire-ci-api.service >/dev/null <<UNIT
          [Unit]
          Description=Adlaire CI API
          Wants=adlaire-ci.timer
          After=network.target adlaire-ci.timer

          [Service]
          Type=simple
          User=root
          WorkingDirectory=${install_dir}
          ExecStart=${bin_dir}/adlaire-ci-api --addr 127.0.0.1:8765 --state-dir ${install_dir}
          KillSignal=SIGTERM
          TimeoutStopSec=15s
          SendSIGKILL=no
          KillMode=none

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo systemctl daemon-reload
          sudo systemctl enable --now adlaire-ci.timer >/dev/null
          sudo systemctl enable --now adlaire-ci-api >/dev/null
          sudo systemctl is-active adlaire-ci.timer >/dev/null
          sudo systemctl cat adlaire-ci.service >/dev/null
          sudo systemctl cat adlaire-ci.timer >/dev/null
          sudo systemctl is-active adlaire-ci-api >/dev/null
          sudo systemctl cat adlaire-ci-api.service >/dev/null
          curl -fsS --max-time 10 http://127.0.0.1:8765/api/health >/dev/null
          record "release-and-service-health" "ok" "service_api_health"

          python3 - "${remote_dir}/admin_password" "${remote_dir}/login.json" <<'PY'
          import json
          import sys
          password = open(sys.argv[1], "r", encoding="utf-8").read().strip()
          open(sys.argv[2], "w", encoding="utf-8").write(json.dumps({"password": password}, separators=(",", ":")))
          PY
          login_json="$(curl -fsS --max-time 10 -H 'Content-Type: application/json' --data-binary "@${remote_dir}/login.json" http://127.0.0.1:8765/api/login)"
          printf '%s' "${login_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))' > "${remote_dir}/token.txt"
          if [ ! -s "${remote_dir}/token.txt" ]; then
            record "admin-and-api-runtime" "failed" "token_missing"
            exit 1
          fi
          "${bin_dir}/adlaire-ci-admin" --api-url http://127.0.0.1:8765 --token-stdin --json status < "${remote_dir}/token.txt" >/dev/null
          test -f "${install_dir}/admin/index.html"
          test -f "${install_dir}/admin/adlaire-ci-sdk.js"
          record "admin-and-api-runtime" "ok" "admin_api_sdk_ui_boundary"

          sudo "${bin_dir}/adlaire-ci-runner" --state-dir "${install_dir}" --once --dry-run >/dev/null
          record "runner-real-operation" "ok" "runner_dry_run_operation"

          if [ "${preexisting_core}" -lt "${#core_binaries[@]}" ] || ! sudo test -d "${remote_dir}/admin-backup"; then
            record "update-rollback-drill" "failed" "prior_core_install_missing"
            exit 1
          fi
          for binary in "${binaries[@]}"; do
            if test -f "${remote_dir}/backup/${binary}"; then
              sudo install -m 0755 "${remote_dir}/backup/${binary}" "${bin_dir}/${binary}"
            else
              sudo rm -f "${bin_dir}/${binary}"
            fi
          done
          if sudo test -d "${remote_dir}/admin-backup"; then
            sudo rm -rf "${install_dir}/admin"
            sudo cp -a "${remote_dir}/admin-backup" "${install_dir}/admin"
          fi
          sudo systemctl restart adlaire-ci.timer
          sudo systemctl restart adlaire-ci-api
          sudo systemctl is-active adlaire-ci.timer >/dev/null
          sudo systemctl is-active adlaire-ci-api >/dev/null
          curl -fsS --max-time 10 http://127.0.0.1:8765/api/health >/dev/null

          for binary in "${binaries[@]}"; do
            sudo install -m 0755 "${remote_dir}/payload/${binary}" "${bin_dir}/${binary}"
            sudo "${bin_dir}/${binary}" --version >/dev/null
          done
          sudo rm -rf "${install_dir}/admin"
          sudo install -d -m 0755 "${install_dir}/admin"
          sudo tar -xzf "${remote_dir}/phase18-admin.tar.gz" -C "${install_dir}/admin"
          sudo systemctl restart adlaire-ci.timer
          sudo systemctl restart adlaire-ci-api
          sudo systemctl is-active adlaire-ci.timer >/dev/null
          sudo systemctl is-active adlaire-ci-api >/dev/null
          curl -fsS --max-time 10 http://127.0.0.1:8765/api/health >/dev/null
          record "update-rollback-drill" "ok" "rollback_and_redeploy"

          record "issue-triage" "ok" "no_issue_detected"
          record "spec-first-fix" "ok" "not_required"
          record "redeploy-and-revalidate" "ok" "known_bug_zero_document_drift_zero"
          close_session "ok" "open_item_0"
          REMOTE_SCRIPT
          chmod 700 "${RUNNER_TEMP}/phase18-remote.sh"
          scp -q -P "${port}" -i "${key_file}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${known_hosts_file}" -o LogLevel=ERROR \
            "${RUNNER_TEMP}/phase18-remote.sh" "${remote}:${remote_dir}/phase18-remote.sh"
          set +e
          ssh "${ssh_opts[@]}" "${remote}" "bash '${remote_dir}/phase18-remote.sh' '${remote_dir}' 'manual-approved-operation-session-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'"
          remote_status="$?"
          scp -q -P "${port}" -i "${key_file}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${known_hosts_file}" -o LogLevel=ERROR \
            "${remote}:${remote_dir}/evidence.jsonl" phase18-evidence.jsonl
          evidence_status="$?"
          set -e
          if [ "${evidence_status}" -eq 0 ]; then
            cat phase18-evidence.jsonl
          fi
          exit "${remote_status}"
